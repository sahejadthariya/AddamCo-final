        const { useState, useEffect, useRef } = React;

        // --- VIDEO ITEM COMPONENT ---
        const VideoItem = ({ src, poster, aspect = 'vertical', onClick }) => {
            const containerRef = useRef(null);
            const videoRef = useRef(null);
            const [isLoaded, setIsLoaded] = useState(false);
            const [shouldLoad, setShouldLoad] = useState(false);
            const [error, setError] = useState(false);
            const [videoSrc, setVideoSrc] = useState(src);
            const retriesRef = useRef(0);
            const MAX_RETRIES = 2;

            useEffect(() => {
                const observer = new IntersectionObserver(
                    ([entry]) => {
                        if (entry.isIntersecting) {
                            if (window.requestIdleCallback) {
                                requestIdleCallback(() => setShouldLoad(true));
                            } else {
                                setShouldLoad(true);
                            }
                        }
                    },
                    { rootMargin: '200px', threshold: 0.01 }
                );

                if (containerRef.current) observer.observe(containerRef.current);
                return () => observer.disconnect();
            }, []);

            useEffect(() => {
                if (!shouldLoad || !videoRef.current) return;

                const video = videoRef.current;
                const playWhenReady = () => {
                    video.play().catch(() => {});
                };

                playWhenReady();
                video.addEventListener('canplay', playWhenReady);
                video.addEventListener('stalled', playWhenReady);

                const visibilityObserver = new IntersectionObserver(
                    ([entry]) => {
                        if (!videoRef.current) return;
                        if (entry.isIntersecting) {
                            videoRef.current.play().catch(() => {});
                        } else {
                            videoRef.current.pause();
                        }
                    },
                    { threshold: 0.1 }
                );

                if (containerRef.current) visibilityObserver.observe(containerRef.current);

                return () => {
                    video.removeEventListener('canplay', playWhenReady);
                    video.removeEventListener('stalled', playWhenReady);
                    visibilityObserver.disconnect();
                };
            }, [shouldLoad]);

            const handleVideoError = () => {
                if (retriesRef.current < MAX_RETRIES) {
                    retriesRef.current += 1;
                    const retryToken = `retry=${Date.now()}-${retriesRef.current}`;
                    const separator = src.includes('?') ? '&' : '?';
                    setVideoSrc(`${src}${separator}${retryToken}`);
                    setError(false);
                    return;
                }
                setError(true);
            };

            const paddingBottom = aspect === 'vertical' ? '177.77%' : '56.25%';

            return (
                <div 
                    ref={containerRef}
                    onClick={onClick}
                    className="relative w-full overflow-hidden border border-white/10 rounded-xl shadow-2xl video-slot-card cursor-pointer bg-zinc-900 transform-gpu"
                    style={{ 
                        paddingBottom,
                        willChange: 'transform',
                        backfaceVisibility: 'hidden'
                    }}

                    {/* Blurred Poster Image */}

                        style={{ backgroundImage: `url(${poster})`, backfaceVisibility: 'hidden' }} 
                    />
                    
                    {shouldLoad && (
                        <video
                            ref={videoRef}
                            src={videoSrc}
                            muted
                            loop
                            playsInline
                            preload="auto"
                            onLoadedData={() => setIsLoaded(true)}
                            onCanPlay={(e) => e.currentTarget.play().catch(() => {})}
                            onError={handleVideoError}
                            className={`absolute inset-0 w-full h-full object-cover transition-opacity duration-1000 transform-gpu ${isLoaded ? 'opacity-100' : 'opacity-0'}`}
                            style={{ backfaceVisibility: 'hidden' }}
                        />
                    )}
                    
                    {error && (
                        <div className="absolute inset-0 flex items-center justify-center bg-black/50 text-[10px] text-white/50 uppercase font-bold">
                            Load Error
                        </div>
                    )}

                    {/* Subtle Dim Overlay */}
                    <div className="absolute inset-0 bg-black/20 group-hover:bg-black/0 transition-colors duration-500 transform-gpu" />
                </div>
            );
        };

                                            </div>
                                        </div>
                                        <div className="flex items-start bg-white p-5 border-4 border-black shadow-[6px_6px_0px_0px_#000000] hover:translate-x-1 hover:-translate-y-1 transition-transform">
                                            <div className="bg-black p-2 mr-4 border-2 border-black shrink-0">
                                                <Icon name="video" size="24" className="text-neon" />
                                            </div>
                                            <div>
                                                <h4 className="text-black font-black uppercase text-sm">Real Story</h4>
                                                <p className="text-[10px] leading-tight text-black/80 font-bold mt-1">Deep dives and high-impact shorts. No fluff, just results.</p>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                
                                <div className="relative group">
                                    {/* Background Accent for Symmetry */}
                                    <div className="absolute inset-0 bg-electric translate-x-4 translate-y-4 -z-10 border-4 border-black opacity-20 group-hover:translate-x-6 group-hover:translate-y-6 transition-transform"></div>
                                    
                                    <div className="bg-black border-4 border-black shadow-[12px_12px_0px_0px_#8F00FF] relative w-full overflow-hidden">
                                        <div className="absolute -top-1 -right-1 bg-white text-black px-4 py-2 font-black text-xs uppercase border-b-4 border-l-4 border-black z-10">
                                            VS_MODE
                                        </div>
                                        
                                        <div className="grid grid-cols-2 text-center border-b-4 border-white">
                                            <div className="py-6 bg-[#222] text-[#666] font-black uppercase tracking-widest text-xs">NPC Agency</div>
                                            <div className="py-6 bg-electric text-white font-black uppercase tracking-widest text-xs border-l-4 border-white">AddamCO</div>
                                        </div>
                                        
                                        <div className="divide-y-2 divide-[#333]">
                                            {[
                                                { bad: 'Posts random clips', good: 'Strategic Storytelling' },
                                                { bad: 'Vanity metrics', good: 'Trust & ROI' },
                                                { bad: 'Generic templates', good: 'Cinematic Production' },
                                                { bad: 'Service provider', good: 'Growth Partner' }
                                            ].map((item, idx) => (
                                                <div key={idx} className="grid grid-cols-2 items-stretch">
                                                    <div className="flex items-center p-4 lg:p-6 text-[10px] lg:text-xs text-[#888] font-bold bg-[#111]">
                                                        <Icon name="x-square" size="14" className="text-red-600 mr-3 flex-shrink-0" />
                                                        {item.bad}
                                                    </div>
                                                    <div className="flex items-center p-4 lg:p-6 text-[10px] lg:text-xs text-white font-bold bg-black border-l-2 border-[#333]">
                                                        <Icon name="check-square" size="14" className="text-neon mr-3 flex-shrink-0" />
                                                        {item.good}
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                        
                                        {/* Footer of the card for more symmetry */}
                                        <div className="bg-electric p-3 border-t-4 border-white flex justify-center">
                                            <div className="w-20 h-1 bg-white/30 rounded-full"></div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>

                    {/* Services Section */}
                    <section id="services" className="py-16 md:py-24 relative bg-electric border-b-4 border-black">
                        <div className="container mx-auto px-6">
                            <div className="mb-12 md:mb-16 border-b-8 border-neon pb-6 inline-block">
                                <h2 className="text-4xl md:text-7xl font-black text-white uppercase drop-shadow-[4px_4px_0px_#000]">Our Pillars</h2>
                            </div>

                            <div className="grid md:grid-cols-2 gap-8 max-w-4xl mx-auto">
                                {[
                                    { icon: 'play', title: 'Content Engine', color: 'bg-white', text: 'text-black', hover: 'bg-neon', desc: 'FLAGSHIP SERVICE. Organic content infrastructure that builds trust.', items: ['Strategy & Scriptwriting', 'Long-Format (9–18 mins)', 'Shorts & Reels', 'Publishing & Management'] },
                                    { icon: 'cpu', title: 'AI Studio', color: 'bg-white', text: 'text-black', hover: 'bg-neon', desc: 'NEXT-GEN PRODUCTION. Virtual sets, AI actors, and VFX.', items: ['Virtual Production', 'AI Actors & Avatars', 'Digital Sets', 'Next-Gen VFX'] }
                                ].map((service, i) => (
                                    <div key={i} className="group relative">
                                        <div className="absolute inset-0 bg-black translate-x-2 translate-y-2 group-hover:translate-x-4 group-hover:translate-y-4 transition-transform border-2 border-black"></div>
                                        <div className={`relative ${service.color} border-4 border-black p-6 md:p-8 h-full group-hover:${service.hover} transition-colors`}>
                                            <div className="w-14 h-14 bg-black border-4 border-black flex items-center justify-center mb-6 shadow-[4px_4px_0px_0px_#8F00FF] group-hover:shadow-[4px_4px_0px_0px_#000000] transition-all">
                                                <Icon name={service.icon} size="28" className={`${service.color === 'bg-neon' ? 'text-neon' : 'text-white'} group-hover:${service.hover === 'bg-neon' ? 'text-neon' : 'text-white'}`} />
                                            </div>
                                            <h3 className="text-xl md:text-2xl font-black text-black mb-4 uppercase">{service.title}</h3>
                                            <p className="text-black/70 mb-6 font-bold text-sm leading-relaxed border-t-2 border-black pt-4">{service.desc}</p>
                                            <ul className="space-y-3">
                                                {service.items.map((item) => (
                                                    <li key={item} className="flex items-center text-sm text-black font-bold">
                                                        <div className="w-3 h-3 bg-electric mr-3 border-2 border-black shrink-0"></div>
                                                        {item}
                                                    </li>
                                                ))}
                                            </ul>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </section>

                    {/* Videos Section - Our Work */}
                    <section id="videos" className="relative h-[100vh] min-h-[700px] purple-glow-bg overflow-hidden group">
                        
                        {/* The Moving Grid */}
                        <div className="absolute inset-0 flex gap-4 md:gap-10 px-4 md:px-10 slot-column-container opacity-100 transition-opacity duration-1000">
                            {/* Column 1 - Fast */}
                            <div className="slot-column flex-1 flex flex-col gap-4 md:gap-10" style={{ '--duration': '24s' }}>
                                {col1.map((v, i) => (
                                    <VideoItem key={`col1-${i}`} src={v.src} poster={v.poster} aspect={v.aspect} onClick={() => setSelectedVideo(v)} />
                                ))}
                            </div>
                            {/* Column 2 - Slow Reverse */}
                            <div className="slot-column-reverse hidden md:flex flex-1 flex flex-col gap-4 md:gap-10" style={{ '--duration': '40s' }}>
                                {col2.map((v, i) => (
                                    <VideoItem key={`col2-${i}`} src={v.src} poster={v.poster} aspect={v.aspect} onClick={() => setSelectedVideo(v)} />
                                ))}
                            </div>
                            {/* Column 3 - Medium */}
                            <div className="slot-column flex-1 flex flex-col gap-4 md:gap-10 pt-20" style={{ '--duration': '32s' }}>
                                {col3.map((v, i) => (
                                    <VideoItem key={`col3-${i}`} src={v.src} poster={v.poster} aspect={v.aspect} onClick={() => setSelectedVideo(v)} />
                                ))}
                            </div>
                            {/* Column 4 - Medium Reverse */}
                            <div className="slot-column-reverse hidden md:flex flex-1 flex flex-col gap-4 md:gap-10 pt-10" style={{ '--duration': '36s' }}>
                                {col4.map((v, i) => (
                                    <VideoItem key={`col4-${i}`} src={v.src} poster={v.poster} aspect={v.aspect} onClick={() => setSelectedVideo(v)} />
                                ))}
                            </div>
                        </div>

                        {/* Premium Content Overlay */}
                        <div className="absolute inset-0 flex flex-col items-center justify-center text-center px-6 z-20 pointer-events-none">
                            <div className="bg-neon text-black px-4 py-1 font-black text-[10px] md:text-xs tracking-[0.3em] uppercase mb-6 shadow-[4px_4px_0px_0px_rgba(0,0,0,1)]">
                                OUR WORK
                            </div>
                            
                            <h2 className="text-4xl md:text-7xl lg:text-8xl font-black text-white leading-[0.9] uppercase italic drop-shadow-[8px_8px_0px_rgba(0,0,0,1)]">
                                HIGH IMPACT <span className="text-neon">CONTENT.</span><br />
                                <span className="bg-white text-black px-4 mt-2 inline-block not-italic">THAT CONVERTS.</span>
                            </h2>
                            
                            <p className="mt-8 max-w-2xl text-white font-bold text-sm md:text-xl uppercase tracking-widest bg-black/80 backdrop-blur-md p-4 border-l-8 border-neon shadow-[10px_10px_0px_0px_rgba(0,0,0,0.5)]">
                                Every frame is designed to stop the scroll, build trust, and drive ROI.
                            </p>
                        </div>

                        {/* Fades for seamless feel */}
                        <div className="absolute top-0 left-0 right-0 h-48 bg-gradient-to-b from-black to-transparent z-10" />
                        <div className="absolute bottom-0 left-0 right-0 h-48 bg-gradient-to-t from-black to-transparent z-10" />
                    </section>

                    {selectedVideo && (
                        <div className="fixed inset-0 bg-black/95 flex items-center justify-center z-[100] p-4 md:p-10" onClick={() => setSelectedVideo(null)}>
                            <div className="relative bg-black border-4 border-neon shadow-[10px_10px_0px_0px_#CCFF00] w-full max-w-5xl" onClick={(e) => e.stopPropagation()}>
                                <button onClick={() => setSelectedVideo(null)} className="absolute -top-12 right-0 md:-top-6 md:-right-6 bg-neon text-black border-4 border-black rounded-full p-2 hover:bg-white transition-all z-[110] shadow-[4px_4px_0px_0px_#000]">
                                    <Icon name="x" size="24" />
                                </button>
                                <div className="relative w-full overflow-hidden" style={{ paddingBottom: selectedVideo.aspect === 'vertical' ? '177.77%' : '56.25%', maxHeight: '80vh' }}>
                                    {selectedVideo.videoId ? (
                                        <iframe 
                                            src={`https://www.youtube-nocookie.com/embed/${selectedVideo.videoId}?rel=0&enablejsapi=1`}
                                            frameBorder="0" 
                                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                                            allowFullScreen
                                            className="absolute top-0 left-0 w-full h-full"
                                        ></iframe>
                                    ) : (
                                        <video 
                                            src={selectedVideo.src} 
                                            controls 
                                            autoPlay 
                                            className="absolute top-0 left-0 w-full h-full object-contain bg-black"
                                        />
                                    )}
                                </div>
                                <div className="p-4 bg-black border-t-4 border-neon flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                    <div className="flex-1">
                                        <h3 className="text-xl font-black text-neon uppercase tracking-tighter">{selectedVideo.title || 'Project Showcase'}</h3>
                                        <p className="text-white/80 font-bold text-sm mt-1 uppercase">{selectedVideo.description || 'High-impact content engine asset.'}</p>
                                    </div>
                                    {selectedVideo.videoId && (
                                        <a 
                                            href={`https://www.youtube.com/watch?v=${selectedVideo.videoId}`} 
                                            target="_blank" 
                                            rel="noopener noreferrer"
                                            className="bg-neon text-black px-4 py-2 font-black text-xs uppercase border-2 border-black hover:bg-white transition-all shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] active:shadow-none active:translate-x-[2px] active:translate-y-[2px]"
                                        >
                                            Watch on YouTube
                                        </a>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* About Section */}
                    <section id="about" className="py-16 md:py-20 bg-black text-neon border-b-4 border-neon">
                        <div className="container mx-auto px-6">
                            <div className="flex flex-col md:flex-row gap-8 md:gap-12">
                                <div className="md:w-1/3 border-b-4 md:border-b-0 md:border-r-4 border-neon pb-6 md:pb-0 md:pr-6">
                                    <h2 className="text-4xl md:text-5xl font-black mb-4 uppercase text-white">Our Journey</h2>
                                    <p className="text-neon font-bold text-lg leading-tight">Founded by Sahejad Thariya in Bengaluru.</p>
                                </div>
                                <div className="md:w-2/3 space-y-0">
                                    <div className="flex group">
                                        <div className="w-20 md:w-24 font-black text-xl py-6 border-b-2 border-neon text-white">2024</div>
                                        <div className="flex-1 border-l-2 border-b-2 border-neon p-4 hover:bg-neon hover:text-black transition-colors">
                                            <div className="flex items-center mb-2"><Icon name="layers" size="20" className="mr-2" /><span className="font-black uppercase">Founded</span></div>
                                            <div className="text-sm font-bold opacity-80">Web & App Development.</div>
                                        </div>
                                    </div>
                                    <div className="flex group">
                                        <div className="w-20 md:w-24 font-black text-xl py-6 border-b-2 border-neon bg-neon text-black flex items-center justify-center">2025</div>
                                        <div className="flex-1 border-l-2 border-b-2 border-neon p-4 bg-[#222] hover:bg-electric hover:text-white transition-colors relative">
                                            <div className="absolute top-2 right-2 bg-electric text-white text-[10px] px-2 py-0.5 font-bold uppercase border border-white">Current</div>
                                            <div className="flex items-center mb-2"><Icon name="cpu" size="20" className="mr-2" /><span className="font-black uppercase">The Pivot</span></div>
                                            <div className="text-sm font-bold opacity-80">Content Engine Launch.</div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>

                    {/* Contact Section */}
                    <section id="contact" className="py-16 md:py-24 bg-neon">
                        <div className="container mx-auto px-6">
                            <div className="border-8 border-black bg-electric p-6 md:p-16 text-center relative shadow-[10px_10px_0px_0px_#000] mb-8">
                                <h2 className="text-3xl md:text-6xl font-black text-white mb-6 uppercase italic drop-shadow-[3px_3px_0px_#000]">Ready to transform?</h2>
                                <div className="flex flex-col md:flex-row justify-center items-center gap-4 mb-8">
                                    <a href="mailto:hello@addam.in" className="w-full md:w-auto flex items-center justify-center bg-white text-black px-6 py-3 font-black uppercase border-4 border-black hover:bg-neon transition-all shadow-[6px_6px_0px_0px_#000]">
                                        <Icon name="mail" size="20" className="mr-3" /> hello@addam.in
                                    </a>
                                    <a href="tel:+917383155363" className="w-full md:w-auto flex items-center justify-center bg-black text-white border-4 border-white px-6 py-3 font-black uppercase hover:bg-white hover:text-black hover:border-black transition-all shadow-[6px_6px_0px_0px_#CCFF00]">
                                        <Icon name="phone" size="20" className="mr-3" /> +91 73831 55363
                                    </a>
                                </div>
                            </div>

                            <div className="max-w-4xl mx-auto bg-white border-4 border-black p-6 md:p-12 shadow-[8px_8px_0px_0px_#000]">
                                <div className="mb-6 border-b-4 border-black pb-4 flex justify-between items-end">
                                    <div>
                                        <h3 className="text-2xl font-black text-black uppercase">Contact Us</h3>
                                        <p className="text-gray-600 font-bold uppercase text-xs mt-1">Send us a message.</p>
                                    </div>
                                </div>
                                <form className="space-y-4" onSubmit={handleSubmit}>
                                    <div className="grid md:grid-cols-2 gap-4">
                                        <input type="text" name="name" onChange={handleInputChange} value={formData.name} placeholder="NAME / ORG" className="w-full bg-[#f0f0f0] border-4 border-black p-3 font-bold text-black focus:outline-none focus:bg-neon placeholder:text-gray-400 transition-colors" required />
                                        <input type="email" name="email" onChange={handleInputChange} value={formData.email} placeholder="EMAIL ADDRESS" className="w-full bg-[#f0f0f0] border-4 border-black p-3 font-bold text-black focus:outline-none focus:bg-neon placeholder:text-gray-400 transition-colors" required />
                                    </div>
                                    <textarea rows="4" name="message" onChange={handleInputChange} value={formData.message} placeholder="BRIEF..." className="w-full bg-[#f0f0f0] border-4 border-black p-3 font-bold text-black focus:outline-none focus:bg-neon placeholder:text-gray-400 transition-colors" required></textarea>
                                    <button type="submit" disabled={formStatus === 'submitting' || formStatus === 'success'} className={`w-full border-4 border-black py-3 font-black uppercase text-base transition-all flex items-center justify-center group shadow-[4px_4px_0px_0px_#8F00FF] hover:shadow-none hover:translate-x-[2px] hover:translate-y-[2px] ${formStatus === 'success' ? 'bg-neon text-black' : 'bg-black text-white hover:bg-electric'}`}>
                                        {formStatus === 'submitting' ? 'Sending...' : formStatus === 'success' ? 'Sent' : 'Send Message'}
                                    </button>
                                </form>
                            </div>
                        </div>
                    </section>

                    <footer className="bg-black border-t-4 border-white py-8">
                        <div className="container mx-auto px-6 text-center md:text-left">
                            <div className="text-2xl font-black text-white mb-2 uppercase italic">Addam<span className="text-neon">CO</span></div>
                            <p className="text-zinc-500 text-[10px] font-bold uppercase tracking-widest">© 2025 AddamCO. All rights reserved.</p>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AddamCoWebsite />);
    </script>
</body>
</html>
